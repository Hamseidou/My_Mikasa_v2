<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Jeu des Tentations</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,400&family=DM+Sans:wght@400;500;600&display=swap">
<style>
html,body{margin:0}
/* Concept: carte nuit, cadre "photo mystère" qui se précise avec la jauge, chapitres, mini-jeux (cartes, grattage, maintien, Non qui fuit). */
:root{
  --bg:#15132b;
  --surface:#201d42;
  --line:#36326a;
  --fg:#f5eefc;
  --muted:#a9a3cf;
  --accent:#ff8f7a;
  --accent2:#ff5f8f;
  --accent-ink:#2a1020;
  --display:'Fraunces',Georgia,'Times New Roman',serif;
  --body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding-block:24px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  background-image:radial-gradient(circle at 20% 0%,#2b2660 0,transparent 55%),radial-gradient(circle at 90% 100%,#3a1f4d 0,transparent 50%);
  background-attachment:fixed;
}
.card{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px 20px 20px;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.top{display:flex;align-items:center;gap:14px;margin-bottom:18px;text-align:left}
.photo{
  width:64px;height:64px;flex:none;border-radius:50%;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--accent-ink);
  font-family:var(--display);font-size:30px;filter:blur(10px);transition:filter .8s ease;border:2px solid var(--line)
}
.gauge{flex:1;min-width:0}
.gauge-top{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
.track{height:8px;border-radius:99px;background:var(--bg);border:1px solid var(--line);overflow:hidden}
.fill{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px;transition:width .6s ease}
.tag{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
h1{font-family:var(--display);font-weight:500;font-size:clamp(25px,7vw,32px);line-height:1.2;margin:0 0 8px;text-wrap:balance}
h1 em{font-style:italic;color:var(--accent)}
.sub{color:var(--muted);margin:0 0 6px;font-size:15px}
.screen{animation:in .45s ease both}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.opts{display:grid;gap:10px;margin-top:18px}
.btn{font-family:var(--body);font-size:17px;font-weight:600;border-radius:12px;border:1px solid transparent;padding:14px 22px;cursor:pointer;min-height:48px}
.btn:focus-visible,.opt:focus-visible,.stop:focus-visible{outline:3px solid var(--fg);outline-offset:3px}
.primary{background:var(--accent);color:var(--accent-ink)}
.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
.opt{background:transparent;color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:13px 14px;min-height:48px;font-family:var(--body);font-size:16px;font-weight:500;cursor:pointer;text-align:center}
.opt[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.opts.done .opt:not([aria-pressed="true"]){opacity:.45}
.lvl{display:grid;gap:10px;margin-top:18px}
.lvl .opt{text-align:left}
.lvl small{display:block;color:var(--muted);font-weight:400;font-size:13px}
.lvl .opt[aria-pressed="true"] small{color:var(--accent-ink)}
.react{min-height:44px;margin:14px 0 0;font-style:italic;font-size:16px}
.full{width:100%;display:block;margin-top:12px;text-align:center;text-decoration:none}
[hidden]{display:none!important}
textarea{width:100%;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:12px;font-family:var(--body);font-size:16px;resize:vertical;min-height:84px;margin-top:16px}
textarea::placeholder{color:var(--muted)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.row .btn{margin:0}
.note{font-size:13px;color:var(--muted);margin:12px 0 0}
.stop{margin-top:16px;background:none;border:0;color:var(--muted);font:inherit;font-size:13px;text-decoration:underline;cursor:pointer;padding:8px}
.big{font-family:var(--display);font-size:64px;line-height:1;margin:6px 0 4px;color:var(--accent);font-variant-numeric:tabular-nums}
.cardq{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:20px 16px;margin-top:16px;font-family:var(--display);font-size:21px;line-height:1.35}
/* maintien */
.hold{position:relative;overflow:hidden;width:100%;margin-top:18px;background:transparent;color:var(--fg);border:1px solid var(--line);user-select:none;-webkit-user-select:none;touch-action:none;-webkit-touch-callout:none}
.hold i{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));z-index:0}
.hold span{position:relative;z-index:1}
/* grattage */
.scratch{position:relative;margin-top:16px;border-radius:14px;overflow:hidden;height:140px;border:1px solid var(--line)}
.scratch .msg{position:absolute;inset:0;display:grid;place-items:center;padding:14px;background:var(--bg);font-family:var(--display);font-size:20px;line-height:1.35}
.scratch canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
/* non qui fuit */
.arena{position:relative;height:150px;margin-top:20px}
.yes{position:absolute;left:12%;top:18px;transition:transform .25s ease}
.no{background:transparent;color:var(--muted);border-color:var(--line);position:absolute;right:12%;top:18px;transition:left .22s ease,top .22s ease,transform .22s ease,opacity .4s ease;touch-action:none}
.no.gone{opacity:0;pointer-events:none}
.quip{position:absolute;left:0;right:0;bottom:6px;margin:0;font-size:14px;color:var(--muted);min-height:22px;font-style:italic}
.giftbox{display:block;margin:18px auto 6px;background:none;border:0;font-size:96px;line-height:1;cursor:pointer;animation:wig 1.4s ease-in-out infinite}
@keyframes wig{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
.gimg{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:14px;margin:14px 0 10px;border:1px solid var(--line);animation:in .6s ease both}
.cap{font-family:var(--display);font-size:19px;margin:0}
.count{font-family:var(--display);font-size:90px;line-height:1.1;color:var(--accent);margin:20px 0}
@media (prefers-reduced-motion:reduce){.screen,.fill,.photo,.yes,.no,.giftbox,.gimg{animation:none;transition:none}}
</style>
</head>
<body>

<main class="card" id="app">
  <div class="top">
    <div class="photo" id="photo" aria-hidden="true">M</div>
    <div class="gauge">
      <div class="gauge-top"><span>Tentation</span><span id="pct">0 %</span></div>
      <div class="track"><div class="fill" id="fill"></div></div>
    </div>
  </div>
  <section class="screen" id="stage"></section>
  <button class="stop" id="stopBtn" type="button" hidden>Arrêter ici</button>
</main>

<script>
/* ====== À PERSONNALISER ====== */
var CONFIG = {
  name: "My Mikasa 🙌",
  school: "HEC Tchad · BAF · L1",
  whatsapp: "23566289061",
  secret: "Tu es la seule personne avec qui j'ai envie de jouer comme ça.",   // message sous la carte à gratter
  photoCaption: "Voilà celui qui pense à toi plus qu'il ne devrait 😏",   // phrase sous ta photo
  mot: "Merci d'avoir joué, My Mikasa. J'ai appris plein de choses sur toi, et je veux en savoir encore plus."   // mot de la fin
};
/* ============================= */

var $ = function(id){ return document.getElementById(id); };
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
var stage = $("stage"), stopBtn = $("stopBtn");
var level = null, steps = [], idx = -1, answers = [];

function setGauge(){
  var v = Math.min(97.87, Math.round(Math.max(0, idx) / Math.max(1, steps.length) * 9787) / 100);
  $("fill").style.width = v + "%"; $("pct").textContent = String(v).replace(".", ",") + " %";
  $("photo").style.filter = "blur(" + Math.round((1 - v/97.87) * 10) + "px)";
}
function render(html){
  stage.style.animation = "none"; void stage.offsetWidth; stage.style.animation = "";
  stage.innerHTML = html;
}
function rec(label, val){ answers.push([label, val]); }

/* ---------- Questions à choix ---------- */
var Q_CHOICE = {
  filiere: { ch:"L'amphi", q:"Banque, Assurance ou Finance : ton domaine préféré ?", label:"Domaine BAF", opts:[
    ["Banque 🏦","Les billets, ça te connaît."],["Assurance 🛡️","Tu protèges tout le monde. Même les cœurs ?"],["Finance 📈","Ambitieuse. J'aime."],["Surtout le diplôme 🎓","Franche. Respect."]] },
  place: { ch:"L'amphi", q:"Ta place en amphi ?", label:"Place en amphi", opts:[
    ["Premier rang","Studieuse… ou tu veux tout voir ?"],["Au milieu","Prudente. Discrète."],["Tout au fond","Je te repère déjà 😏"],["Près de la porte","Toujours prête à t'échapper."]] },
  pause: { ch:"L'amphi", q:"À la pause, tu fais quoi ?", label:"Pause", opts:[
    ["Je mange","Bon appétit. Je te garde une place."],["Je reste sur mon téléphone","Et si c'était moi à l'écran ?"],["Je discute avec mes amies","Elles doivent savoir des secrets."],["Je m'isole","Mystérieuse."]] },
  shoes: { ch:"Ton style", q:"Ton style de chaussures ?", label:"Chaussures", opts:[
    ["Talons 👠","Hmm… toi, je te vois plutôt en baskets 😏"],["Baskets Nike 👟","Je savais. Rien ne te va mieux."],["Ça dépend de qui m'accompagne","Réponse dangereuse. J'aime."]] },
  craque: { ch:"Ton style", q:"Ce qui te fait craquer chez quelqu'un ?", label:"Craque pour", opts:[
    ["Le regard","Noté. Je vais soigner mes regards 😌"],["L'humour","Ça tombe bien, j'en ai en réserve."],["La voix","Intéressant… je note."],["L'attention","Bonne réponse. Elle compte beaucoup."]] },
  enerve: { ch:"Ton style", q:"Ce qui t'énerve le plus ?", label:"Énervée par", opts:[
    ["Qu'on m'ignore","Message reçu. Difficile de t'ignorer, de toute façon."],["Qu'on me fasse attendre","Je serai rapide alors 😉"],["Qu'on me mente","Je serai honnête. Presque tout le temps."]] },
  matin: { ch:"Ton style", q:"Un message de quelqu'un : plutôt le matin ou le soir ?", label:"Message", opts:[
    ["Le matin ☀️","Je retiens : bonjour en premier."],["Le soir 🌙","Les confidences de nuit, hein ?"],["Quand il veut, tant que c'est lui","Facile. Parfait."]] }
};
/* Cartes Vérité / Défi selon le niveau */
var CARDS = {
  doux: { v:["Ton plus beau souvenir à HEC ?","Ce qui te fait sourire en ce moment ?"], d:["Envoie-moi un emoji qui te décrit.","Dis-moi ta chanson du moment."] },
  coquin: { v:["Ce qui te fait fondre chez un garçon ?","Ton plus grand point faible face à un beau sourire ?"], d:["Écris une phrase qui me fait sourire toute la journée.","Dis-moi ce que tu ferais si je t'ignorais 😏"] },
  piquant: { v:["Quel regard est ton arme la plus dangereuse ?","Dans quelle ambiance tu fonds complètement ?"], d:["Décris en trois mots le genre de soirée qui te fait craquer.","Écris-moi un mot qui commence par T comme Tentation."] }
};

function buildSteps(){
  var s = [];
  ["filiere","place"].forEach(function(k){ s.push({t:"choice", k:k}); });
  s.push({t:"text", ch:"L'amphi", q:"Ton rêve après HEC ?", label:"Rêve", ph:"Dis-moi en un mot ou deux…"});
  ["pause","shoes","craque","enerve"].forEach(function(k){ s.push({t:"choice", k:k}); });
  s.push({t:"text", ch:"Ton style", q:"Une chose que personne ne sait sur toi ?", label:"Secret", ph:"Je garde ça pour moi 😌"});
  s.push({t:"choice", k:"matin"});
  s.push({t:"card", ch:"Tentations"});
  s.push({t:"hold", ch:"Tentations"});
  s.push({t:"scratch", ch:"Tentations"});
  s.push({t:"special", ch:"Tentations"});
  return s;
}

/* ---------- Écrans ---------- */
function intro(){
  stopBtn.hidden = true;
  render('<p class="tag">' + esc(CONFIG.school) + '</p>' +
    '<h1>Pour <em>' + esc(CONFIG.name) + '</em></h1>' +
    '<p class="sub">Un jeu rien que pour toi : ta photo mystère se précise à chaque réponse.</p>' +
    '<button class="btn primary full" id="go" type="button">Je joue</button>');
  $("go").addEventListener("click", chooseLevel);
}
function chooseLevel(){
  render('<p class="tag">Avant de commencer</p><h1>Choisis ton <em>niveau</em></h1>' +
    '<p class="sub">C\'est toi qui décides jusqu\'où ça va.</p>' +
    '<div class="lvl" id="lvl">' +
    '<button class="opt" type="button" data-l="doux">😇 Doux<small>Complice et léger</small></button>' +
    '<button class="opt" type="button" data-l="coquin">😏 Coquin<small>Taquin, avec des sous-entendus</small></button>' +
    '<button class="opt" type="button" data-l="piquant">🔥 Piquant (18+)<small>Plus audacieux, toujours suggestif</small></button></div>');
  $("lvl").addEventListener("click", function(e){
    var b = e.target.closest(".opt"); if (!b) return;
    var l = b.getAttribute("data-l");
    if (l === "piquant") return gate18();
    start(l);
  });
}
function gate18(){
  render('<p class="tag">Niveau Piquant</p><h1>Réservé aux <em>18 ans et plus</em></h1>' +
    '<p class="sub">Les questions sont plus audacieuses. Tu peux arrêter à tout moment.</p>' +
    '<label style="display:flex;gap:10px;align-items:flex-start;text-align:left;margin-top:16px;font-size:15px">' +
    '<input type="checkbox" id="ok18" style="width:22px;height:22px;flex:none;margin-top:2px;accent-color:#ff8f7a">' +
    '<span>J\'ai 18 ans ou plus et je veux continuer.</span></label>' +
    '<button class="btn primary full" id="go18" type="button" disabled>Continuer en Piquant</button>' +
    '<button class="btn ghost full" id="back18" type="button">Plutôt niveau Coquin</button>');
  $("ok18").addEventListener("change", function(){ $("go18").disabled = !$("ok18").checked; });
  $("go18").addEventListener("click", function(){ start("piquant"); });
  $("back18").addEventListener("click", function(){ start("coquin"); });
}
function start(l){
  level = l; steps = buildSteps(); idx = -1; answers = [];
  rec("Niveau", {doux:"Doux 😇", coquin:"Coquin 😏", piquant:"Piquant 🔥"}[l]);
  stopBtn.hidden = false;
  next();
}
function next(){
  idx++; setGauge();
  if (idx >= steps.length) return finale();
  var S = steps[idx];
  if (S.t === "choice") return stepChoice(S);
  if (S.t === "text") return stepText(S);
  if (S.t === "card") return stepCard(S);
  if (S.t === "hold") return stepHold(S);
  if (S.t === "scratch") return stepScratch(S);
  if (S.t === "special") return stepSpecial(S);
}
function head(ch, q){ return '<p class="tag">Chapitre : ' + esc(ch) + '</p><h1>' + esc(q) + '</h1>'; }

function stepChoice(S){
  var Q = Q_CHOICE[S.k], h = head(Q.ch, Q.q) + '<div class="opts" id="opts">';
  Q.opts.forEach(function(o, i){ h += '<button class="opt" type="button" data-i="' + i + '" aria-pressed="false">' + esc(o[0]) + '</button>'; });
  h += '</div><p class="react" id="react" aria-live="polite"></p><button class="btn primary full" id="nx" type="button" hidden>Continuer</button>';
  render(h);
  var box = $("opts");
  box.addEventListener("click", function(e){
    var b = e.target.closest(".opt"); if (!b) return;
    var i = +b.getAttribute("data-i");
    Array.prototype.forEach.call(box.children, function(c){ c.setAttribute("aria-pressed", c === b ? "true" : "false"); });
    box.classList.add("done");
    $("react").textContent = Q.opts[i][1];
    $("nx").hidden = false;
    answers = answers.filter(function(a){ return a[0] !== Q.label; });
    rec(Q.label, Q.opts[i][0]);
  });
  $("nx").addEventListener("click", next);
}
function stepText(S){
  render(head(S.ch, S.q) + '<textarea id="tx" placeholder="' + esc(S.ph) + '" aria-label="' + esc(S.q) + '"></textarea>' +
    '<div class="row"><button class="btn ghost" id="skip" type="button">Passer</button><button class="btn primary" id="ok" type="button">Continuer</button></div>');
  $("skip").addEventListener("click", next);
  $("ok").addEventListener("click", function(){ var v = $("tx").value.trim(); if (v) rec(S.label, v); next(); });
}
function stepCard(S){
  var C = CARDS[level];
  render(head(S.ch, "Vérité ou Défi ?") +
    '<div class="row"><button class="btn ghost" id="cv" type="button">Vérité</button><button class="btn ghost" id="cd" type="button">Défi</button></div>' +
    '<div id="cardArea"></div>');
  function pick(kind){
    var list = kind === "v" ? C.v : C.d, txt = list[Math.floor(Math.random()*list.length)];
    $("cardArea").innerHTML = '<div class="cardq">' + esc(txt) + '</div>' +
      '<textarea id="ans" placeholder="Ta réponse…" aria-label="Ta réponse"></textarea>' +
      '<div class="row"><button class="btn ghost" id="cskip" type="button">Passer</button><button class="btn primary" id="cok" type="button">Fait</button></div>';
    $("cv").disabled = $("cd").disabled = true;
    $("cskip").addEventListener("click", next);
    $("cok").addEventListener("click", function(){
      var v = $("ans").value.trim();
      rec((kind === "v" ? "Vérité" : "Défi") + " (" + txt + ")", v || "fait");
      next();
    });
  }
  $("cv").addEventListener("click", function(){ pick("v"); });
  $("cd").addEventListener("click", function(){ pick("d"); });
}
function stepHold(S){
  render(head(S.ch, "Fais monter la tentation") + '<p class="sub">Maintiens ton doigt sur le bouton.</p>' +
    '<button class="btn hold" id="hb" type="button"><i id="hf"></i><span>Maintiens appuyé 😏</span></button>' +
    '<button class="btn primary full" id="nx" type="button" hidden>Continuer</button>');
  var hb = $("hb"), hf = $("hf"), t0 = 0, raf = 0, done = false, DUR = 1800;
  function tick(){
    var p = Math.min(1, (performance.now() - t0) / DUR);
    hf.style.width = (p*100) + "%";
    if (p >= 1) { done = true; hb.querySelector("span").textContent = "Tentation au maximum 🔥"; $("nx").hidden = false; return; }
    raf = requestAnimationFrame(tick);
  }
  hb.addEventListener("pointerdown", function(e){ if (done) return; e.preventDefault(); t0 = performance.now(); raf = requestAnimationFrame(tick); });
  function release(){ if (done) return; cancelAnimationFrame(raf); hf.style.width = "0"; }
  hb.addEventListener("pointerup", release); hb.addEventListener("pointerleave", release); hb.addEventListener("pointercancel", release);
  hb.addEventListener("contextmenu", function(e){ e.preventDefault(); });
  $("nx").addEventListener("click", next);
}
function stepScratch(S){
  render(head(S.ch, "Gratte pour découvrir") + '<div class="scratch" id="sc"><div class="msg">' + esc(CONFIG.secret) + '</div><canvas id="cv"></canvas></div>' +
    '<button class="btn primary full" id="nx" type="button" hidden>Continuer</button>');
  var sc = $("sc"), cv = $("cv"), w = sc.clientWidth, h = sc.clientHeight, ctx = cv.getContext("2d", {willReadFrequently:true}), down = false, shown = false;
  cv.width = w; cv.height = h;
  var g = ctx.createLinearGradient(0, 0, w, h); g.addColorStop(0, "#ff8f7a"); g.addColorStop(1, "#ff5f8f");
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = "rgba(42,16,32,.7)"; ctx.font = "600 16px sans-serif"; ctx.textAlign = "center"; ctx.fillText("Gratte ici 👆", w/2, h/2 + 5);
  function scratch(e){
    if (!down) return; e.preventDefault();
    var r = cv.getBoundingClientRect(), x = (e.clientX - r.left) * (w / r.width), y = (e.clientY - r.top) * (h / r.height);
    ctx.globalCompositeOperation = "destination-out"; ctx.fillStyle = "#000"; ctx.beginPath(); ctx.arc(x, y, 20, 0, 6.3); ctx.fill();
    check();
  }
  function check(){
    if (shown) return;
    var d = ctx.getImageData(0, 0, w, h).data, c = 0, n = 0;
    for (var i = 3; i < d.length; i += 160) { n++; if (d[i] === 0) c++; }
    if (c / n > 0.45) { shown = true; cv.style.transition = "opacity .5s"; cv.style.opacity = "0"; cv.style.pointerEvents = "none"; $("nx").hidden = false; }
  }
  cv.addEventListener("pointerdown", function(e){ down = true; cv.setPointerCapture(e.pointerId); scratch(e); });
  cv.addEventListener("pointermove", scratch);
  cv.addEventListener("pointerup", function(){ down = false; });
  cv.addEventListener("pointercancel", function(){ down = false; });
  $("nx").addEventListener("click", next);
}
var quips = ["Tu es sûre ?","Réfléchis bien…","Le bouton s'enfuit.","Il est essoufflé.","Le bouton est fatigué, laisse-le tranquille.","Bon. Il ne reviendra plus."];
function stepSpecial(S){
  render(head(S.ch, "Question sur moi : je pense à toi plus que je ne devrais ?") +
    '<div class="arena" id="arena"><button class="btn primary yes" id="yes" type="button">Oui</button>' +
    '<button class="btn no" id="no" type="button">Non</button><p class="quip" id="quip" aria-live="polite"></p></div>');
  var no = $("no"), yes = $("yes"), arena = $("arena"), tries = 0;
  function overlaps(x, y, w, h){
    var l = yes.offsetLeft-12, t = yes.offsetTop-12, r = yes.offsetLeft+yes.offsetWidth+12, b = yes.offsetTop+yes.offsetHeight+12;
    return x < r && x+w > l && y < b && y+h > t;
  }
  function dodge(e){
    if (e) e.preventDefault();
    if (no.classList.contains("gone")) return;
